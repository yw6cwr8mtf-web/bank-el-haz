<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك الحظ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a36;--ink:#f6edd4;--gold:#e8b93a;--sq:#f4ead0;--tur:#2fc4b2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#21447f,var(--bg));color:var(--ink);font:400 15px/1.5 Cairo,Tahoma,sans-serif}
#app{max-width:680px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font:700 clamp(30px,8vw,46px)/1.1 'Reem Kufi',Cairo,sans-serif;margin:6px 0;background:linear-gradient(#fff3b0,var(--gold) 60%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub,.hint{margin:6px 0;opacity:.8;font-size:13px}
.fm{display:grid;gap:12px;max-width:420px;margin-top:14px}
label{display:grid;gap:4px;font-weight:700}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid #fff3;background:#0d2147;color:var(--ink)}
button{font:inherit;font-weight:900;border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(#f6cf5c,#d9a21b);color:#13284d;cursor:pointer;box-shadow:0 3px 0 #8a6200}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6200}
button.g{background:#ffffff14;color:var(--ink);box-shadow:none;border:1.5px solid #fff3}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tur);outline-offset:2px}
.bd{display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);aspect-ratio:1;gap:2px;padding:3px;background:linear-gradient(135deg,#e8b93a,#8a6200,#e8b93a);border-radius:14px;direction:ltr;box-shadow:0 10px 30px #0009}
.sq{background:linear-gradient(#fbf3dc,var(--sq));color:#13284d;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;direction:rtl;font-size:clamp(7px,1.9vw,11px);line-height:1.15;overflow:hidden;padding:1px;cursor:pointer;border-radius:3px}
.sq.cur{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 0 3px var(--tur)}to{box-shadow:inset 0 0 0 3px #fff,0 0 14px var(--tur)}}
.sq.sel{outline:2px dashed #d6403a;outline-offset:-2px}
.sq i{position:absolute;top:0;left:0;right:0;height:20%}
.sq i+b{margin-top:18%}
.sq small{opacity:.75}
.sq span{position:absolute;bottom:2px;display:flex;gap:1px}
.sq em{font-style:normal;display:grid;place-items:center;width:clamp(13px,3.6vw,22px);height:clamp(13px,3.6vw,22px);font-size:clamp(9px,2.5vw,15px);border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #fff,0 2px 4px #0006}
.hop{animation:hop .13s}
@keyframes hop{50%{transform:translateY(-8px) scale(1.3)}}
.ct{grid-area:2/2/9/9;background:repeating-linear-gradient(45deg,#1a3566 0 12px,#17305f 12px 24px);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;direction:rtl;overflow:auto;font-size:clamp(11px,2.8vw,15px)}
.ct button{padding:6px 12px;font-size:inherit}
.dc{display:flex;gap:6px;font-size:clamp(38px,11vw,62px);line-height:1}
.dc span{display:inline-block;background:#fff;color:#13284d;border-radius:10px;padding:0 4px;box-shadow:0 4px 0 #0006}
.dc.rl span{animation:tum .16s infinite linear}
@keyframes tum{to{transform:rotate(360deg)}}
.cd{margin:0;padding:4px 10px;border-radius:8px;background:#fff;color:#13284d;font-weight:700}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.inf{margin:8px 0;padding:8px 12px;border-radius:10px;background:#ffffff12;font-size:13px;min-height:44px}
.rx{display:flex;gap:6px;justify-content:center;margin:8px 0}
.pls{display:grid;gap:6px;margin:10px 0}
.pl{display:flex;align-items:center;gap:8px;background:#ffffff14;border-radius:10px;padding:6px 10px;border-inline-start:6px solid}
.pl b{flex:1}
.pl em{font-style:normal;font-weight:900;color:var(--gold)}
.pl.on{background:#e8b93a33;box-shadow:0 0 0 2px var(--gold)}
.pl.out{opacity:.4;text-decoration:line-through}
.lg{list-style:none;margin:0;padding:0;font-size:13px;opacity:.9}
.lg li:first-child{font-weight:700;animation:pop .4s}
#note{position:fixed;inset-inline:12px;bottom:12px;background:#13284d;border:1.5px solid var(--gold);padding:8px 12px;border-radius:10px;max-width:520px;margin:auto;z-index:9}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.fl{position:absolute;bottom:8%;left:var(--x);font-size:36px;text-align:center;animation:rise 2.3s ease-out forwards}
.fl small{display:block;font-size:12px}
@keyframes rise{to{transform:translateY(-75vh) scale(1.5);opacity:0}}
</style>
</head>
<body>
<div id="app"></div><div id="note" role="status" hidden></div><div id="fx"></div>
<script>
const $=s=>document.querySelector(s),cp=o=>JSON.parse(JSON.stringify(o)),esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),sl=ms=>new Promise(r=>setTimeout(r,ms)),r6=()=>1+Math.random()*6|0;
const SQ=[['s','بداية'],['p','الفيوم',600,40,'br'],['c','حظ'],['p','بني سويف',600,60,'br'],['t','ضريبة',1000],['r','محطة رمسيس',2000],['p','المنيا',1000,80,'sk'],['p','أسيوط',1200,100,'sk'],['j','السجن'],['p','سوهاج',1400,120,'pk'],['c','حظ'],['p','قنا',1400,120,'pk'],['p','الأقصر',1600,140,'pk'],['r','محطة الإسكندرية',2000],['p','أسوان',1800,160,'or'],['p','دمياط',2000,180,'or'],['k','استراحة'],['p','المنصورة',2200,200,'rd'],['c','حظ'],['p','طنطا',2200,200,'rd'],['p','الإسماعيلية',2400,220,'rd'],['r','محطة الجيزة',2000],['p','بورسعيد',2600,240,'yl'],['p','السويس',2800,260,'yl'],['g','اذهب للسجن'],['p','الغردقة',3000,280,'gr'],['c','حظ'],['p','شرم الشيخ',3200,320,'gr'],['r','محطة مصر',2000],['p','الإسكندرية',3500,350,'nv'],['t','ضريبة',800],['p','القاهرة',4000,500,'nv']];
const GC={br:'#8b5a2b',sk:'#6ec6f0',pk:'#e86fa5',or:'#f08a24',rd:'#d6403a',yl:'#f2cf2f',gr:'#2e9e5b',nv:'#2b4ba0'};
const COL=['#e0524d','#2aa59b','#e8b92d','#8e5bd0','#3f8ee0'],TK=['🐫','🏺','🐊','🦅','🐈'],IC={s:'🏁',j:'🔒',k:'☕',g:'🚔',c:'🎴',t:'💸',r:'🚆'},DF='⚀⚁⚂⚃⚄⚅',RX=['😂','🔥','😭','👏','🤑'];
const CH=[['علاوة من الشغل +1000',1000],['مخالفة مرور -500',-500],['ورثت من خالك +1500',1500],['صلّحت العربية -800',-800],['ارجع لخانة البداية',0,'go'],['اتقبض عليك! على السجن',0,'jail'],['اتقدّم 3 خانات',3,'mv'],['ارجع 3 خانات',-3,'mv'],['كل لاعب يدفعلك 200',200,'all'],['كسبت يانصيب +2000',2000]];
let S=null,room='',local=false,joinName='',tries=0,nt,sel=-1,busy=0,rolling=0,lastV=0,chain=Promise.resolve(),vis=[],dv=[1,1],ac,mu=0,myId;
try{myId=sessionStorage.bh||(sessionStorage.bh='u'+Math.random().toString(36).slice(2,9))}catch(e){myId='u'+Math.random().toString(36).slice(2,9)}
const note=t=>{const n=$('#note');n.textContent=t;n.hidden=!t;clearTimeout(nt);nt=setTimeout(()=>n.hidden=true,6000)};
const bp=(f,d=.1,t='sine',v=.06)=>{if(mu||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(1e-4,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}};
function float(o){const f=document.createElement('div');f.className='fl';f.style.setProperty('--x',(8+Math.random()*80)+'vw');f.innerHTML=(RX.concat(['🎉','✨','🪙','💰','🏆']).includes(o.e)?o.e:'👍')+(o.n?'<small>'+esc(o.n)+'</small>':'');$('#fx').append(f);setTimeout(()=>f.remove(),2400)}
const lg=(s,t)=>{s.log=[t,...s.log].slice(0,6)};
const full=(s,i,k)=>SQ.every((q,j)=>q[4]!=SQ[i][4]||(s.ow[j]&&s.ow[j].o==k));
const rent=(s,i)=>{const q=SQ[i],o=s.ow[i];if(q[0]=='r')return 250*Object.keys(s.ow).filter(j=>SQ[j][0]=='r'&&s.ow[j].o==o.o).length;return q[3]*[1,4,8,14][o.l]*(!o.l&&full(s,i,o.o)?2:1)};
const mine=()=>S&&S.ph=='play'&&(local||S.pl[S.t].id==myId);
function nxt(s){let n=s.t;do{n=(n+1)%s.pl.length}while(s.pl[n].o);s.t=n;s.rl=0;s.by=null;s.card='';s.dbl=0}
function fin(s){s.pl.forEach((p,k)=>{if(p.m<0&&!p.o){p.o=1;Object.keys(s.ow).forEach(i=>{if(s.ow[i].o==k)delete s.ow[i]});lg(s,p.n+' أفلس وخرج')}});const al=s.pl.filter(x=>!x.o);if(al.length<2){s.ph='over';s.win=al[0]?al[0].n:''}else if(s.pl[s.t].o)nxt(s)}
function jl(s){const p=s.pl[s.t];p.p=8;p.j=1;s.dbl=0;lg(s,p.n+' راح السجن')}
function go(s,n){const p=s.pl[s.t],o=p.p;p.p=(p.p+n+32)%32;if(n>0&&p.p<o){p.m+=1500;lg(s,p.n+' عدّى البداية +1500')}lnd(s)}
function lnd(s){const p=s.pl[s.t],i=p.p,q=SQ[i],o=s.ow[i];
if(q[0]=='p'||q[0]=='r'){if(!o)s.by=i;else if(o.o!=s.t){const r=rent(s,i);p.m-=r;s.pl[o.o].m+=r;lg(s,p.n+' دفع إيجار '+r+' لـ '+s.pl[o.o].n)}}
else if(q[0]=='t'){p.m-=q[2];lg(s,p.n+' دفع ضريبة '+q[2])}
else if(q[0]=='g')jl(s);
else if(q[0]=='c'){const c=CH[Math.random()*CH.length|0];s.card=c[0];lg(s,p.n+': '+c[0]);
if(c[2]=='go'){p.p=0;p.m+=1500}else if(c[2]=='jail')jl(s);else if(c[2]=='mv')go(s,c[1]);else if(c[2]=='all')s.pl.forEach((x,k)=>{if(k!=s.t&&!x.o){x.m-=c[1];p.m+=c[1]}});else p.m+=c[1]}}
function show(n,f){if(!f&&n.v<=lastV)return;lastV=n.v;const o=S;S=n;chain=chain.then(()=>anim(o,n));
if(n.ph=='lobby'&&room&&joinName&&!n.pl.some(p=>p.id==myId)&&n.pl.length<5&&tries++<6){const s=cp(n);s.pl.push(P(myId,joinName));commit(s)}}
async function commit(s){s.v=(S&&S.v||0)+1;show(s);if(room)try{const r=await fetch('/set?room='+room,{method:'POST',body:JSON.stringify(s)});if(r.status==409)show(await r.json(),1)}catch(e){note('الاتصال فيه مشكلة، جرّب تاني')}}
const mut=f=>{const s=cp(S);f(s);commit(s)};
async function anim(o,n){
if(o&&o.ph=='play'&&n.rn>o.rn){busy=rolling=1;for(let i=0;i<9;i++){dv=[r6(),r6()];render();bp(250+i*35,.05,'square',.03);await sl(80)}rolling=0}
dv=n.d||dv;n.pl.forEach((p,k)=>{if(vis[k]==null||n.ph!='play')vis[k]=p.p});
for(let mv=1;mv;){mv=0;n.pl.forEach((p,k)=>{if(vis[k]!=p.p){const d=(p.p-vis[k]+32)%32;vis[k]=d<=12?(vis[k]+1)%32:p.p;mv=1}});if(mv){busy=1;render();bp(520,.05,'triangle',.05);await sl(130)}}
busy=0;render();
if(o&&o.pl.length==n.pl.length){const dn=n.pl.map((p,k)=>p.m-o.pl[k].m);if(dn.some(x=>x<0))bp(170,.3,'sawtooth',.05);else if(dn.some(x=>x>0))[880,1175].forEach((f,i)=>setTimeout(()=>bp(f,.12,'triangle'),i*90))}
if(n.card&&(!o||o.card!=n.card))bp(990,.2,'triangle');
if(n.ph=='over'&&(!o||o.ph!='over')){for(let i=0;i<40;i++)setTimeout(()=>float({e:['🎉','✨','🪙','💰','🏆'][i%5]}),i*60);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>bp(f,.3,'triangle'),i*140))}}
const A={
roll:()=>mine()&&!S.rl&&mut(s=>{const p=s.pl[s.t],a=r6(),b=r6(),j=p.j;s.d=[a,b];s.rl=1;s.rn++;s.card='';s.dbl=0;
if(j){if(a==b){p.j=0;lg(s,p.n+' جاب دبل وخرج من السجن')}else if(++p.j>3){p.m-=500;p.j=0;lg(s,p.n+' دفع 500 وخرج من السجن')}else{lg(s,p.n+' لسه في السجن');return nxt(s)}}
go(s,a+b);s.dbl=a==b&&!j&&!s.pl[s.t].j?1:0;fin(s)}),
pay:()=>mine()&&!S.rl&&S.pl[S.t].j&&mut(s=>{const p=s.pl[s.t];if(p.m>=500){p.m-=500;p.j=0;lg(s,p.n+' دفع 500 وخرج')}}),
buy:()=>mine()&&S.by!=null&&mut(s=>{const p=s.pl[s.t],i=s.by,q=SQ[i];if(p.m>=q[2]){p.m-=q[2];s.ow[i]={o:s.t,l:0};lg(s,p.n+' اشترى '+q[1])}s.by=null}),
skip:()=>mine()&&mut(s=>{s.by=null}),
build:()=>mine()&&mut(s=>{const p=s.pl[s.t],i=p.p,o=s.ow[i],c=SQ[i][2]/2;if(o&&o.o==s.t&&o.l<3&&SQ[i][0]=='p'&&full(s,i,s.t)&&p.m>=c){p.m-=c;o.l++;lg(s,p.n+' بنى في '+SQ[i][1])}}),
end:()=>mine()&&S.rl&&S.by==null&&mut(s=>{if(s.dbl){s.dbl=0;s.rl=0;s.card='';lg(s,s.pl[s.t].n+' جاب دبل وبيرمي تاني')}else nxt(s)}),
stop:()=>(local||S.host==myId)&&S.ph=='play'&&mut(s=>{const w=s.pl.map((p,k)=>p.o?-1e9:p.m+Object.keys(s.ow).filter(i=>s.ow[i].o==k).reduce((a,i)=>a+SQ[i][2]*(1+s.ow[i].l/2),0));s.ph='over';s.win=s.pl[w.indexOf(Math.max(...w))].n}),
start:()=>S.ph=='lobby'&&S.host==myId&&S.pl.length>1&&mut(s=>{s.ph='play'}),
again:()=>(local||S.host==myId)&&mut(s=>{Object.assign(s,{ph:'play',ow:{},t:0,rl:0,by:null,card:'',log:[],win:'',dbl:0});s.pl.forEach(p=>Object.assign(p,{m:15000,p:0,j:0,o:0}))})};
const P=(id,n)=>({id,n,m:15000,p:0,j:0,o:0});
const fresh=(code,host,pl)=>({ph:'lobby',code,pl,ow:{},t:0,d:[1,1],rl:0,rn:0,dbl:0,by:null,card:'',log:[],host,v:0});
function loc(){local=true;room='';const n=+$('#ln').value,s=fresh('',  'local',[...Array(n)].map((_,i)=>P('l'+i,'لاعب '+(i+1))));s.ph='play';s.v=1;lastV=0;vis=[];show(s,1)}
async function join(){
const nm=($('#nm').value.trim()||'لاعب').slice(0,14),rm=$('#rm').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'')||String(1000+Math.random()*9000|0);
joinName=nm;room=rm;let s=null;
try{const r=await fetch('/state?room='+rm);if(r.status==200)s=await r.json()}catch(e){return note('السيرفر مش متاح دلوقتي')}
s=s||fresh(rm,myId,[]);
const add=!s.pl.some(p=>p.id==myId)&&s.ph=='lobby'&&s.pl.length<5;
if(add)s.pl.push(P(myId,nm));
dv=s.d||[1,1];lastV=0;vis=[];S=s;
if(add)await commit(s);else show(s,1);
const es=new EventSource('/events?room='+rm);es.onmessage=e=>show(JSON.parse(e.data));es.addEventListener('ev',e=>float(JSON.parse(e.data)));es.onerror=()=>note('الاتصال اتقطع.. بنحاول نرجّعه')}
const H={join,loc,...A,
mu:()=>{mu^=1;render()},
rx:b=>{const o={e:b.dataset.e,n:(S.pl.find(p=>p.id==myId)||{}).n||''};room?fetch('/ev?room='+room,{method:'POST',body:JSON.stringify(o)}):float(o)},
cpy:async()=>{const u=location.origin+'/?room='+S.code;try{await navigator.clipboard.writeText(u);note('اتنسخ لينك الأوضة، ابعته لأصحابك')}catch(e){prompt('انسخ اللينك',u)}}};
const pos=i=>i<9?[9,9-i]:i<17?[17-i,1]:i<25?[1,i-15]:[i-23,9];
function center(){const c=S.pl[S.t],i=c.p,q=SQ[i],o=S.ow[i];
if(S.ph=='over')return`<h2 class="pop">🏆 ${esc(S.win)} كسب!</h2>`+((local||S.host==myId)?'<button data-a="again">لعبة جديدة</button>':'');
let h=`<div class="dc${rolling?' rl':''}"><span>${DF[dv[0]-1]}</span><span>${DF[dv[1]-1]}</span></div><b>دور ${TK[S.t]} ${esc(c.n)}</b>`;
if(busy)return h;
if(S.card)h+=`<p class="cd pop">🎴 ${esc(S.card)}</p>`;
if(!mine())return h+`<p class="hint">${S.pl.some(p=>p.id==myId)?'مستني دور '+esc(c.n)+'…':'انت متفرج'}</p>`;
if(!S.rl)return h+'<button data-a="roll">🎲 ارمي النرد</button>'+(c.j?'<button class="g" data-a="pay">ادفع 500 واخرج</button>':'');
if(S.by!=null)return h+`<button data-a="buy" ${c.m<SQ[S.by][2]?'disabled':''}>اشتري ${SQ[S.by][1]} بـ ${SQ[S.by][2]}</button><button class="g" data-a="skip">مش عايز</button>`;
const can=o&&o.o==S.t&&o.l<3&&q[0]=='p'&&full(S,i,S.t)&&c.m>=q[2]/2;
return h+(can?`<button data-a="build">🏠 ابني بـ ${q[2]/2}</button>`:'')+`<button data-a="end">${S.dbl?'دبل! ارمي تاني 🔥':'خلّصت دوري'}</button>`}
const info=()=>{if(sel<0)return'اضغط على أي خانة لتفاصيلها';const q=SQ[sel],o=S.ow[sel],w=o?' | مملوكة لـ '+esc(S.pl[o.o].n)+(o.l?' '+'🏠'.repeat(o.l):''):' | متاحة';
if(q[0]=='p')return`<b>${q[1]}</b>: السعر ${q[2]} ج | الإيجار ${q[3]} (ضعفه لو معاك المجموعة كلها، وبيزيد مع البناء: ${q[3]*4} / ${q[3]*8} / ${q[3]*14})${w}`;
if(q[0]=='r')return`<b>${q[1]}</b>: السعر ${q[2]} ج | الإيجار 250 × عدد المحطات اللي معاك${w}`;
return`<b>${q[1]}</b>: `+{s:'عدّي منها واستلم 1500',j:'ادفع 500 أو هات دبل عشان تخرج',k:'استراحة، مفيش حاجة',g:'اذهب للسجن!',c:'اسحب كارت حظ',t:'ادفع ضريبة '+q[2]}[q[0]]};
const top=()=>`<div class="top"><h1>بنك الحظ</h1><button class="g" data-a="mu" aria-label="الصوت">${mu?'🔇':'🔊'}</button></div>`;
function game(){return top()+`<div class="bd">${SQ.map((q,i)=>{const [r,c]=pos(i),o=S.ow[i],t=q[0];return`<div class="sq${S.ph=='play'&&vis[S.t]==i?' cur':''}${sel==i?' sel':''}" data-i="${i}" style="grid-row:${r};grid-column:${c}${o?';border-bottom:5px solid '+COL[o.o]:''}">${q[4]?`<i style="background:${GC[q[4]]}"></i>`:''}<b>${IC[t]||''}${q[1]}</b><small>${o?'🏠'.repeat(o.l):t=='t'?'−'+q[2]:q[2]||''}</small><span>${S.pl.map((p,k)=>vis[k]==i&&!p.o?`<em class="${busy&&k==S.t?'hop':''}" style="--c:${COL[k]}">${TK[k]}</em>`:'').join('')}</span></div>`}).join('')}<div class="ct">${center()}</div></div>
<div class="inf">${info()}</div><div class="rx">${RX.map(e=>`<button class="g" data-a="rx" data-e="${e}">${e}</button>`).join('')}</div>
${(local||S.host==myId)&&S.ph=='play'?'<button class="g" data-a="stop">🏁 إنهاء اللعبة (الأغنى يكسب)</button>':''}<div class="pls">${S.pl.map((p,k)=>`<div class="pl${k==S.t&&S.ph=='play'?' on':''}${p.o?' out':''}" style="border-color:${COL[k]}"><span>${TK[k]}</span><b>${esc(p.n)}${p.id==myId?' (أنت)':''} ${p.j?'🔒':''}</b><small>${Object.values(S.ow).filter(x=>x.o==k).length} ملك</small><em>${p.m} ج</em></div>`).join('')}</div>
<ul class="lg">${S.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`}
const lobby=()=>top()+`<h2>أوضة ${esc(S.code)}</h2><p class="sub">ابعت لينك الأوضة لأصحابك. اللاعبين ${S.pl.length} من 5</p><div class="pls">${S.pl.map((p,k)=>`<div class="pl pop" style="border-color:${COL[k]}"><span>${TK[k]}</span><b>${esc(p.n)}${p.id==myId?' (أنت)':''}</b></div>`).join('')}</div><button class="g" data-a="cpy">📋 انسخ لينك الأوضة</button> `+(S.host==myId?`<button data-a="start" ${S.pl.length<2?'disabled':''}>ابدأ اللعب</button>`:'<p class="hint">مستنيين صاحب الأوضة يبدأ اللعب…</p>');
const entry=()=>top()+`<p class="sub">اشتري المدن، خد إيجارات، وسيب الحظ يشتغل. لحد 5 لاعبين أونلاين.</p><div class="fm"><label>اسمك<input id="nm" maxlength="14" placeholder="مثلاً: كريم"></label><label>كود الأوضة<input id="rm" maxlength="12" value="${esc(new URLSearchParams(location.search).get('room')||'')}" placeholder="مثلاً: 1234"></label><button data-a="join">ادخل الأوضة</button><p class="hint">اكتب نفس الكود عند كل أصحابك، أو ابعتلهم اللينك من جوّه الأوضة.</p><label>لعب على جهاز واحد<select id="ln"><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button class="g" data-a="loc">ابدأ لعب محلي</button></div>`;
function render(){$('#app').innerHTML=!S?entry():S.ph=='lobby'?lobby():game()}
document.addEventListener('click',e=>{try{ac=ac||new(window.AudioContext||webkitAudioContext)();ac.resume()}catch(x){}
const b=e.target.closest('[data-a]');if(b&&!b.disabled){H[b.dataset.a]&&H[b.dataset.a](b);return}
const q=e.target.closest('.sq');if(q&&S&&S.ph!='lobby'){sel=+q.dataset.i;render()}});
render();
</script>
</body>
</html>
